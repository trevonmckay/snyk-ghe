AWSTemplateFormatVersion: '2010-09-09'
Description: Snyk GHE webhook service on AWS App Runner (DynamoDB + Secrets Manager).

Parameters:
  ContainerImageUri:
    Type: String
    Description: ECR image URI with tag, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/snyk-ghe:1.0.0

  TableName:
    Type: String
    Default: installations

  GitHubApiBaseUrl:
    Type: String
    Description: ghe.com REST API base, e.g. https://api.SUBDOMAIN.ghe.com/

  GitHubAppId:
    Type: String

  SnykDefaultOrgId:
    Type: String
    Default: ''

  SnykDefaultSeverity:
    Type: String
    Default: high

  SnykDefaultEcosystem:
    Type: String
    Default: nuget

  # Each scanner picks its engine independently so a product can be moved to the Test API, or rolled back,
  # without touching the others. IaC has no engine parameter: Snyk's Test API accepts an `iac` scan config
  # but no resource type feeds it a scan component, so the app rejects Snyk:Engines:Iac=Api at startup.
  SnykEngineOpenSource:
    Type: String
    Default: Cli
    AllowedValues: [Cli, Api]
    Description: Engine for the Open Source (SCA) scan. Api submits dependency graphs to the Snyk Test API; Cli runs `snyk test`.

  SnykEngineCode:
    Type: String
    Default: Cli
    AllowedValues: [Cli, Api]
    Description: Engine for the Code (SAST) scan. Api requires SnykScmIntegrationId and repositories imported through that SCM integration.

  SnykScmIntegrationId:
    Type: String
    Default: ''
    Description: >-
      Snyk SCM integration id (GET /v1/org/{orgId}/integrations). Required when SnykEngineCode is Api: the
      API-backed Code scan reads source through the integration, so repositories imported by the CLI are not
      visible to it.

  SnykMonitorTimeoutSeconds:
    Type: Number
    Default: 900
    Description: >-
      Timeout in seconds for a single `snyk monitor` invocation. Monitoring uploads a dependency snapshot and
      can outrun a test scan on large repos, so it has its own bound. On timeout the monitor is skipped and the
      check simply has no Snyk link.

  HostShutdownTimeoutSeconds:
    Type: Number
    Default: 240
    Description: >-
      Seconds the .NET host waits for the SQS worker to drain in-flight scans on shutdown (SIGTERM). App Runner
      allows a fixed platform grace period before SIGKILL, so keep this at or below that window; the SQS message
      of any scan that does not finish stays invisible for Sqs:VisibilityTimeoutSeconds and is redelivered.

  SqsMaxConcurrentMessages:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: >-
      Scans processed in parallel per App Runner instance (the AWS analog of Azure's per-replica concurrency).
      Scans are heavy (clone + Snyk), so the default of 1 is sequential; raise it for more concurrency, but also
      raise the instance Cpu/Memory below to match — unlike Azure, these scans share one instance rather than
      fanning out across replicas.

  GitHubPrivateKeyPem:
    Type: String
    NoEcho: true

  GitHubWebhookSecret:
    Type: String
    NoEcho: true

  SnykToken:
    Type: String
    NoEcho: true

  AdminApiKey:
    Type: String
    NoEcho: true

Resources:
  InstallationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Org
          AttributeType: S
      KeySchema:
        - AttributeName: Org
          KeyType: HASH

  GitHubPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: snyk-ghe/github-app-private-key
      SecretString: !Ref GitHubPrivateKeyPem

  WebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: snyk-ghe/github-webhook-secret
      SecretString: !Ref GitHubWebhookSecret

  SnykTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: snyk-ghe/snyk-token
      SecretString: !Ref SnykToken

  AdminApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: snyk-ghe/admin-api-key
      SecretString: !Ref AdminApiKey

  # Dead-letter queue for deliveries that exhaust the redrive maxReceiveCount, so failures are
  # retained for inspection rather than lost. 14-day retention is the SQS maximum.
  WebhookDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: snyk-ghe-webhook-deliveries-dlq
      MessageRetentionPeriod: 1209600

  # Durable buffer between webhook ingestion and the (slow) Snyk scan: the App Runner instance enqueues
  # the raw validated delivery and its background worker drains it. VisibilityTimeout must exceed the
  # longest clone + scan (matches Sqs__VisibilityTimeoutSeconds below) or a delivery is processed twice.
  WebhookQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: snyk-ghe-webhook-deliveries
      VisibilityTimeout: 1800
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WebhookDeadLetterQueue.Arn
        maxReceiveCount: 5

  # Lets App Runner pull the image from a private ECR repository.
  AppRunnerEcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  # The running service's identity: DynamoDB data access + reading the injected secrets.
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: registry-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt InstallationsTable.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref GitHubPrivateKeySecret
                  - !Ref WebhookSecret
                  - !Ref SnykTokenSecret
                  - !Ref AdminApiKeySecret
              # Lets the self-service registration flow write the generated private key + webhook secret.
              - Effect: Allow
                Action: secretsmanager:PutSecretValue
                Resource:
                  - !Ref GitHubPrivateKeySecret
                  - !Ref WebhookSecret
              # Send (controller), receive/delete (background worker), and change visibility (long scans).
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt WebhookQueue.Arn

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: snyk-ghe
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ContainerImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              - Name: Storage__Provider
                Value: DynamoDb
              - Name: Storage__TableName
                Value: !Ref TableName
              - Name: Storage__AwsRegion
                Value: !Ref AWS::Region
              # The table is created by this stack, so the app must not attempt CreateTable.
              - Name: Storage__CreateTableIfMissing
                Value: 'false'
              # Selects the durable SQS webhook queue (sender + background worker) over the in-process fallback.
              - Name: Sqs__QueueUrl
                Value: !Ref WebhookQueue
              - Name: Sqs__AwsRegion
                Value: !Ref AWS::Region
              - Name: Sqs__VisibilityTimeoutSeconds
                Value: '1800'
              - Name: Sqs__MaxConcurrentMessages
                Value: !Sub '${SqsMaxConcurrentMessages}'
              - Name: Host__ShutdownTimeoutSeconds
                Value: !Sub '${HostShutdownTimeoutSeconds}'
              - Name: GitHub__ApiBaseUrl
                Value: !Ref GitHubApiBaseUrl
              - Name: GitHub__AppId
                Value: !Ref GitHubAppId
              - Name: Snyk__DefaultSnykOrgId
                Value: !Ref SnykDefaultOrgId
              - Name: Snyk__DefaultSeverityThreshold
                Value: !Ref SnykDefaultSeverity
              - Name: Snyk__DefaultEcosystem
                Value: !Ref SnykDefaultEcosystem
              - Name: Snyk__MonitorTimeoutSeconds
                Value: !Sub '${SnykMonitorTimeoutSeconds}'
              - Name: Snyk__Engines__OpenSource
                Value: !Ref SnykEngineOpenSource
              - Name: Snyk__Engines__Code
                Value: !Ref SnykEngineCode
              - Name: Snyk__ScmIntegrationId
                Value: !Ref SnykScmIntegrationId
              # Lets the self-service registration flow write the generated private key + webhook secret.
              - Name: SecretRepository__Provider
                Value: AwsSecretsManager
              - Name: SecretRepository__AwsRegion
                Value: !Ref AWS::Region
            RuntimeEnvironmentSecrets:
              - Name: GitHub__PrivateKeyPem
                Value: !Ref GitHubPrivateKeySecret
              - Name: GitHub__WebhookSecret
                Value: !Ref WebhookSecret
              - Name: Snyk__Token
                Value: !Ref SnykTokenSecret
              - Name: Storage__AdminApiKey
                Value: !Ref AdminApiKeySecret
      InstanceConfiguration:
        Cpu: 0.5 vCPU
        Memory: 1 GB
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /healthz
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

Outputs:
  WebhookUrl:
    Description: Configure this as the GitHub App webhook URL.
    Value: !Sub 'https://${Service.ServiceUrl}/api/github/webhooks'
  ServiceUrl:
    Value: !GetAtt Service.ServiceUrl
  DynamoDbTable:
    Value: !Ref InstallationsTable
  WebhookQueueUrl:
    Description: Durable SQS queue buffering webhook deliveries for the background scan worker.
    Value: !Ref WebhookQueue
  WebhookDeadLetterQueueUrl:
    Description: Dead-letter queue holding deliveries that exhausted the redrive maxReceiveCount.
    Value: !Ref WebhookDeadLetterQueue
